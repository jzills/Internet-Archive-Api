name: PR Validation

on:
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: lib/package-lock.json

      - name: Install dependencies
        working-directory: ./lib
        run: npm ci

      - name: Build
        working-directory: ./lib
        run: npm run build
