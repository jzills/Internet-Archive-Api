name: Release

on:
  push:
    branches:
      - 'release/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: lib/package-lock.json

      - name: Install dependencies
        working-directory: ./lib
        run: npm ci

      - name: Run tests
        working-directory: ./lib
        run: npx vitest run --reporter=verbose

  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Extract version from branch name
        id: version
        run: |
          VERSION=$(bash .github/scripts/extract-version.sh "${GITHUB_REF#refs/heads/}")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
          cache-dependency-path: lib/package-lock.json

      - name: Install dependencies
        working-directory: ./lib
        run: npm ci

      - name: Set version
        working-directory: ./lib
        run: npm version ${{ steps.version.outputs.value }} --no-git-tag-version

      - name: Build
        working-directory: ./lib
        run: npm run build

      - name: Publish to npm
        working-directory: ./lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  merge:
    name: Open PR to Main
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      pull-requests: write
    steps:
      - name: Create PR and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Release v${{ needs.publish.outputs.version }}" \
            --body "Automated release PR for v${{ needs.publish.outputs.version }}. Package published to npm successfully." \
            --base main \
            --head "${{ github.ref_name }}")
          gh pr merge "$PR_URL" --merge --auto
